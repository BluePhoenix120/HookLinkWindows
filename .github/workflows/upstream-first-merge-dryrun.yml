name: Dry-run upstream-first engine merge (no changes to main)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engine/**'
      - 'ENGINE_PIN.json'
      - 'ENGINE_PIN_FILES.json'
      - 'tools/merge_upstream_first_dryrun.py'
      - '.github/workflows/upstream-first-merge-dryrun.yml'

permissions:
  contents: read

jobs:
  reference-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dry-run full upstream-first three-way merge with HookLink and necessary Windows changes
        run: python3 -B tools/merge_upstream_first_dryrun.py --report upstream-first-dryrun.md
      - name: Upload conflicting-source review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-first-merge-review
          path: upstream-first-dryrun.md
          if-no-files-found: warn
