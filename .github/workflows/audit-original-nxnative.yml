name: Audit ALL original NXnative source differences

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engine/**'
      - 'ENGINE_PIN.json'
      - 'ENGINE_PIN_FILES.json'
      - 'tools/audit_upstream_overlays.py'
      - '.github/workflows/audit-original-nxnative.yml'

permissions:
  contents: read

jobs:
  audit-all-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare every original NXnative, HookLink and Windows source difference
        run: python3 -B tools/audit_upstream_overlays.py --report upstream-audit.md
      - name: Upload complete upstream discrepancy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-nxnative-upstream-differences
          path: upstream-audit.md
          if-no-files-found: warn
