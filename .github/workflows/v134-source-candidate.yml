name: V1.3.4 official-first source candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/reconcile_v134_timing.py'
      - 'tools/reconcile_v134_shaders.py'
      - 'tools/check_windows_translator.py'
      - '.gitattributes'
      - 'tools/reconcile_v134_pso.py'
      - 'tools/reconcile_v134_mesh.py'
      - 'tools/reconcile_v134_renderer.py'
      - 'tools/reconcile_v134_settings.py'
      - 'tools/reconcile_v134_ultrawide.py'
      - 'tools/reconcile_v134_semantics.py'
      - 'tools/reconcile_v134_graphics.py'
      - 'tools/reconcile_v134_final_audit.py'
      - 'tools/reconcile_v134_provenance.py'
      - 'tools/nxw_proc_group.py'
      - 'tools/test_nxw_proc_group.py'
      - 'tests/test_*.py'
      - '.github/workflows/v134-source-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upstream compression and ARM64 execution dependencies
        run: python -m pip install backports.zstd unicorn
      - name: Reconcile official timing and shader pipeline and check candidate source
        run: python3 -B tools/reconcile_v134_timing.py --output "$RUNNER_TEMP/v134-candidate"
      - name: Upload candidate patch and check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v134-source-candidate
          path: ${{ runner.temp }}/v134-candidate
          if-no-files-found: error
  windows-process-supervision:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Windows worker-tree cleanup
        run: python -B tools/test_nxw_proc_group.py -v
  native-ios:
    needs: candidate
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME: 0400486024DEC000
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v134-source-candidate
          path: ${{ runner.temp }}/v134
      - name: Compile the exact source candidate with the iPhone SDK and Windows UIKit launcher
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-engine"
          tar -xzf "$RUNNER_TEMP/v134/candidate-engine.tar.gz" -C "$RUNNER_TEMP/candidate-engine"
          cd "$RUNNER_TEMP/candidate-engine"
          xcodebuild -downloadComponent MetalToolchain
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dm/ios/tools/compile_check.py")
          s=p.read_text()
          old="dirs = list(dict.fromkeys(os.path.dirname(s) for s in srcs))"
          assert s.count(old)==1
          s=s.replace(old,"srcs += [os.path.join(repo, 'win/ios', f) for f in sorted(os.listdir(os.path.join(repo, 'win/ios'))) if f.endswith('.m')]\n"+old)
          assert "'-O1', '-w'" in s
          s=s.replace("'-O1', '-w'", "'-O1', '-w', '-ferror-limit=0'")
          p.write_text(s)
          PY
          python3 dm/ios/tools/compile_check.py
      - name: Run exact candidate native host audio regressions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate-engine"
          make -C dm/host game_profile GAME="$GAME"
          make -C dm/host/tests GAME="$GAME" build/t_audio build/t_audio_spsc build/t_audio_stats build/t_output_stream build/t_audio_input
          cd dm/host/tests
          for test in t_audio t_audio_spsc t_audio_stats t_output_stream t_audio_input; do "./build/$test"; done
      - name: Run exact candidate graphics pacing contracts and compile native frame-generation test
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate-engine"
          make -C dm/gfx/tests GAME="$GAME" t_fg_pacing t_link_drain t_link_latch t_present_history t_framegen
          cd dm/gfx/tests
          for test in t_fg_pacing t_link_drain t_link_latch t_present_history; do "./$test"; done
          cat > "$RUNNER_TEMP/fg-capability.m" <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #import <MetalFX/MetalFX.h>
          int main(void) { @autoreleasepool {
              id<MTLDevice> d = MTLCreateSystemDefaultDevice();
              return d && [MTLFXFrameInterpolatorDescriptor supportsMetal4FX:d] && [MTLFXSpatialScalerDescriptor supportsMetal4FX:d] ? 0 : 77;
          } }
          EOF
          xcrun clang -fobjc-arc "$RUNNER_TEMP/fg-capability.m" -framework Foundation -framework Metal -framework MetalFX -o "$RUNNER_TEMP/fg-capability"
          rc=0
          "$RUNNER_TEMP/fg-capability" || rc=$?
          if [ "$rc" -eq 0 ]; then
            MTL_DEBUG_LAYER=1 ./t_framegen
            MTL_DEBUG_LAYER=1 ./t_framegen size
          elif [ "$rc" -eq 77 ]; then
            echo "::notice::Native GPU interpolation execution not available on this runner; frame-generation test compiled, device test remains required."
          else
            exit "$rc"
          fi
  windows-candidate-regressions:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v134-source-candidate
          path: ${{ runner.temp }}/v134
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cache codec
        run: python -m pip install backports.zstd
      - name: Replace engine with exact candidate and run behavioral tests
        shell: pwsh
        run: |
          Remove-Item -LiteralPath engine -Recurse -Force
          New-Item -ItemType Directory -Path engine | Out-Null
          tar -xzf "$env:RUNNER_TEMP/v134/candidate-engine.tar.gz" -C engine
          if ($LASTEXITCODE -ne 0) { throw 'Candidate extraction failed' }
          python -B -m unittest discover -s tests -p 'test_windows_mods.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows mod regression failed' }
          python -B -m unittest discover -s tests -p 'test_windows_c1_table_stamp.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'C1 stamp regression failed' }
          python -B -m unittest discover -s tests -p 'test_shader_cache_windows.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows cache regression failed' }
          python -B -m unittest discover -s tests -p 'test_rewrite_windows_parallel.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows parallel rewriter regression failed' }
          python -B -m unittest discover -s tests -p 'test_windows_sdk_match_cuts.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows SDK cut regression failed' }
  full-windows-candidate:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v134-source-candidate
          path: ${{ runner.temp }}/v134
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Checkout exact unpublished candidate
        id: checkout-candidate
        shell: pwsh
        run: |
          git fetch "$env:RUNNER_TEMP/v134/candidate.bundle" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate checkout failed' }
          $candidate = Get-Content "$env:RUNNER_TEMP/v134/candidate.json" -Raw | ConvertFrom-Json
          if ((git rev-parse HEAD) -ne $candidate.commit) { throw 'Candidate commit mismatch' }
          if ((git rev-parse 'HEAD:engine') -ne $candidate.engine_tree) { throw 'Candidate engine tree mismatch' }
          python -m pip install backports.zstd
          if ($LASTEXITCODE -ne 0) { throw 'Codec installation failed' }
          python -B tools/release_audit.py .
          if ($LASTEXITCODE -ne 0) { throw 'Source-only audit failed' }
      - name: Run complete Windows regression suite without suppressing historical failures
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Complete candidate regression suite failed' }
      - uses: actions/setup-dotnet@v4
        if: always() && steps.checkout-candidate.outcome == 'success'
        with:
          dotnet-version: '10.0.x'
      - name: Build official pinned and patched SPIRV-Cross for Windows
        if: steps.checkout-candidate.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "$env:RUNNER_TEMP/spirv-cross-src"
          $build = "$env:RUNNER_TEMP/spirv-cross-build"
          git clone --depth 1 --branch vulkan-sdk-1.4.363.0 https://github.com/KhronosGroup/SPIRV-Cross.git $src
          if ($LASTEXITCODE -ne 0) { throw 'SPIRV-Cross clone failed' }
          if ((git -C $src rev-parse HEAD) -ne 'f11ba9f0b21ba8fc15153d50a2a1ae31ab1cf8f7') { throw 'SPIRV-Cross pin mismatch' }
          git -C $src apply "$PWD/engine/dm/gfx/tools/spirv_cross_bin/ordered-ne.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Official SPIRV-Cross patch failed' }
          cmake -S $src -B $build -A x64 -DSPIRV_CROSS_ENABLE_TESTS=OFF -DSPIRV_CROSS_SKIP_INSTALL=ON
          if ($LASTEXITCODE -ne 0) { throw 'SPIRV-Cross configure failed' }
          cmake --build $build --config Release --target spirv-cross --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'SPIRV-Cross build failed' }
          $exe = Get-ChildItem $build -Filter spirv-cross.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'SPIRV-Cross binary missing' }
          & $exe.FullName --revision
          if ($LASTEXITCODE -ne 0) { throw 'SPIRV-Cross execution failed' }
          "CANDIDATE_SPIRV_CROSS=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Build and verify real managed shader translator
        if: always() && steps.checkout-candidate.outcome == 'success'
        shell: pwsh
        run: |
          $summary = Get-Content "$env:RUNNER_TEMP/v134/summary.json" -Raw | ConvertFrom-Json
          if (-not $env:CANDIDATE_SPIRV_CROSS) { throw 'Pinned SPIRV-Cross was not built' }
          python -B tools/check_windows_translator.py --expected-source $summary.final_source_audit.canonical_source_fingerprint --spirv-cross "$env:CANDIDATE_SPIRV_CROSS" --evidence "$env:RUNNER_TEMP/v134-windows-toolchain.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate translator smoke test failed' }
      - name: Upload measured Windows toolchain evidence
        uses: actions/upload-artifact@v4
        with:
          name: v134-windows-toolchain
          path: ${{ runner.temp }}/v134-windows-toolchain.json
          if-no-files-found: error
      - name: Build candidate GUI executable (not a release)
        if: always() && steps.checkout-candidate.outcome == 'success'
        shell: pwsh
        run: ./tools/build_windows_gui_exe.ps1
